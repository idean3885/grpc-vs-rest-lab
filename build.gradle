buildscript {
  dependencies {
    classpath "com.diffplug.spotless:spotless-plugin-gradle:6.18.0"
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${property('spring-boot.version')}"
  }
}

plugins {
  id 'java'
  id 'io.spring.dependency-management' version '1.1.7'
}

sourceCompatibility = '17'

dependencyManagement {
  imports {
    //noinspection GrUnresolvedAccess
    mavenBom "org.springframework.boot:spring-boot-dependencies:${property('spring-boot.version')}"
  }
}

repositories {
  mavenCentral()
}

allprojects {
  repositories {
    mavenCentral()
  }

  apply plugin: 'io.spring.dependency-management'
  dependencyManagement {
    imports {
      mavenBom "io.grpc:grpc-bom:${property('grpc.version')}"
      mavenBom "com.google.protobuf:protobuf-bom:${property('protobuf.version')}"
    }
  }
}

tasks.register('printProjectDirs') {
  doLast {
    subprojects.forEach { println(rootProject.projectDir.relativePath(it.projectDir)) }
  }
}

