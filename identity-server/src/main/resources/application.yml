spring:
  application:
    name: identity-server
  threads:
    # 호출 측은 전 구간 플랫폼 스레드로 고정한다. 여기에 가상 스레드를 켜면
    # REST 와 gRPC 두 경로에 똑같이 걸려서 측정 축이 흐려진다. 상수로 둬야
    # 상류 프로토콜 차이만 남는다.
    virtual:
      enabled: false

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-keep-alive-requests: -1
    keep-alive-timeout: 60s

profile:
  client:
    rest-base-url: http://localhost:8081
    grpc-host: localhost
    grpc-port: 9090
    # 톰캣 워커 수와 맞춘다. 풀이 워커보다 작으면 REST 쪽이 커넥션 대기로 밀린다.
    max-connections: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    io.github.idean3885: INFO
